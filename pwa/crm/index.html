<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مدیر فروش">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#7c2d12">
  <title>اپ مدیر فروش — هخامنش</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="../icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="../icons/app-icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/app-icon-180.png">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #7c2d12; color: #d4af37;
      font-family: Vazirmatn, Tahoma, sans-serif;
      overflow: hidden; text-align: center;
    }
    iframe {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; background: #7c2d12;
    }
    .hint {
      position: fixed; right: 12px; left: 12px; bottom: 16px; z-index: 5;
      background: #111; color: #f5e6b8; border: 1px solid #d4af37;
      border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.7;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .hint b { color: #d4af37; }
    .hint button {
      margin-top: 8px; width: 100%; padding: 10px;
      border: 0; border-radius: 10px; background: #d4af37; color: #000;
      font-family: inherit; font-weight: 700; font-size: 14px;
    }
    @media (display-mode: standalone) {
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <iframe id="app" title="مدیر فروش" allow="geolocation; clipboard-write"></iframe>
  <div class="hint" id="hint">
    برای لوگوی هخامنش روی صفحهٔ گوشی، از منوی مرورگر
    <b>Add to Home screen</b>
    / نصب برنامه را بزنید — نه از لینک گوگل.
    <button type="button" id="hintClose">متوجه شدم</button>
  </div>
  <script>window.HK_PWA = {"id": "crm", "gas": "https://script.google.com/macros/s/AKfycbx2-RqwLpi9JB6wspeh7En82CQxmkB6WFUsnHqq_idHmhXvyVZVa6up95vOu3AExokBgw/exec"};</script>
  <script src="../shell.js"></script>
</body>
</html>
